server {
    listen 80;
    server_name _;

    # Letterhead and template DOCX uploads go through Django admin and routinely
    # exceed nginx's 1m default, which would reject them as 413 before Django
    # ever saw the request.
    client_max_body_size 50m;

    # Liveness. Answering from nginx keeps the SPA fallback from returning 200
    # for a probe when the app itself is broken.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Readiness, answered by Django rather than nginx so that the platform only
    # sends traffic once gunicorn can actually serve it. The probe presents the
    # replica's own address as Host, which Django would reject, so this is the
    # one proxied location that pins Host to loopback -- settings.py allows that
    # value for exactly this reason.
    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Serve the React Vite frontend
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Django
    location /api/ {
        # nginx's default is 60 s, which was the real ceiling on every request:
        # a draft that took 75 s to generate reached the browser as a CORS-less
        # 504 ("Failed to fetch") while gunicorn went on to save it. Stay under
        # Container Apps ingress's own 240 s. Work that can outlast this belongs
        # on a background thread with a row to poll, as the argument gym does.
        proxy_read_timeout 230s;
        proxy_send_timeout 230s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy admin requests to Django
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Serve Django static files (admin panel, etc)
    location /static/ {
        alias /app/backend/staticfiles/;
    }

    # Uploaded templates and stationery require Django model permissions.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
