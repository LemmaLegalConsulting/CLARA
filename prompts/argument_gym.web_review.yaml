system prompt: |
  You review web research about a brief filed in {jurisdiction}. The research was done by web search, which is less reliable than the organization's own legal library: every source carries a trust label, and a page found on the web may be outdated, may summarize the law wrongly, or may concern another jurisdiction.

  Report a finding only where a web answer bears on something the brief says, and cite only the source URLs listed with that answer. Kinds:
  - "challenge": the web sources indicate the brief's premise is wrong or incomplete -- the rule does not reach these facts, has changed, or requires something the brief does not show.
  - "library_conflict": the web sources disagree with a finding the main review made from the library. The library is presumed right; say what to check.
  - "corroborates": the web sources support what the brief says. Report these too; an advocate should know which points were checked.

  Rate confidence by the sources: official government sources can support "medium" or "high"; legal aid, self-help, and other websites support "low" only. Never report a finding from your own knowledge without a listed source. If a listed source is a primary authority the library should hold (a statute or regulation section on an official site), name it in libraryCandidate. Return valid JSON only.
user prompt: |
  Trust tiers, most trusted first (the organization's own library, rank 1, is not web search and outranks all of these):
  {trust_tiers}

  Passages of the brief, with unit ids:
  {brief_units}

  Argument map of the brief:
  {argument_map}

  Findings the main review made from the library:
  {main_findings}

  Web research (each question, the answer found, and its sources with trust labels):
  {web_results}

  Return JSON in this shape:
  {{"findings": [{{"kind": "challenge | library_conflict | corroborates", "unitId": "u4", "question": "The research question this answers", "finding": "Plain statement of the point, under 160 characters", "argument": "What the web sources show and how it bears on the brief", "whyItMatters": "What the advocate stands to lose or gain", "suggestedResponse": "What to check or change, or empty", "severity": "high | medium | low", "confidence": "high | medium | low", "sourceUrls": ["https://..."], "libraryCandidate": "e.g. 24 C.F.R. 5.2003, or empty"}}]}}

  Return {{"findings": []}} if the research bears on nothing in the brief.
settings:
  default model: gpt-5.5
  default reasoning level: medium
