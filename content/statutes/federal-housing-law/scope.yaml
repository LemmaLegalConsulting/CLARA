# Coverage scope for the federal housing-law corpus.
#
# Maintained by hand. Everything else in this directory is generated by
# scripts/ingest_federal_housing_law.py; do not hand-edit it.
#
# The corpus exists so that a brief citing a federal tenant protection can be
# checked against the text that defines who it protects. The CARES Act notice
# rule is the motivating example: 15 U.S.C. 9058 applies only to a "covered
# property", which it defines by reference to the VAWA list of covered housing
# programs (34 U.S.C. 12491(a)) and the rural housing voucher program
# (42 U.S.C. 1490r), or to a federally backed mortgage. Without the
# cross-referenced definitions in the corpus, nothing can tell a reader whether
# a given building is covered.
#
# Ring 1 is what an eviction defence in assisted housing routinely turns on.
# Ring 2 is what those sections cross-reference for coverage and definitions,
# and the federal law that reaches the same tenancies from another direction:
# fair housing and disability, the tax credit, USDA rural housing, the other
# programs on the VAWA covered-housing list, servicemembers, and screening.

sources:
  usc:
    name: United States Code
    publisher: Office of the Law Revision Counsel (uscode.house.gov); GovInfo as fallback
    # Read first from uscode.house.gov, whose text states the public law it is
    # current through. If that cannot be read, the GovInfo link service's
    # latest annual edition, which lags enactments. Each record keeps which it
    # came from (text_basis) and how current it is (current_through).
    base_url: https://www.govinfo.gov/link/uscode
    text_basis: official_annual_edition
  cfr:
    name: Electronic Code of Federal Regulations
    publisher: Office of the Federal Register and the U.S. Government Publishing Office
    # The eCFR is updated daily and is authoritative but not the official
    # legal edition (the annual CFR is). Each record keeps the eCFR date read.
    base_url: https://www.ecfr.gov
    text_basis: ecfr_current

targets:
  # CARES Act tenant protections and the definitions they depend on.
  - ring: 1
    code: usc
    title: 15
    sections: ["9058"]
    label: CARES Act -- temporary moratorium on eviction filings (CARES Act § 4024)
    # Popular names a brief uses instead of the code section. Indexed with the
    # text so a search for the name finds the section.
    retrieval_hints: ["CARES Act", "CARES Act section 4024", "Pub. L. 116-136 § 4024", "30-day notice to vacate", "covered dwelling", "covered property"]
  - ring: 1
    code: usc
    title: 34
    sections: ["12491"]
    label: VAWA housing protections and the list of covered housing programs
    retrieval_hints: ["Violence Against Women Act", "VAWA", "covered housing program", "42 U.S.C. 14043e-11"]
  - ring: 1
    code: usc
    title: 42
