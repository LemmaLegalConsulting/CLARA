name: Deploy to Azure

# Deploys on merge to main. Merging is the trigger, so a pull request that never
# lands never deploys, and every deployed commit is one that passed review.
on:
  push:
    branches: [main]
  # Pull requests run the test job only -- the deploy job below is gated on the
  # event being a push. A check that only runs after the merge cannot stop a
  # broken build from reaching production, which is the whole point of having
  # one.
  pull_request:
  workflow_dispatch:

# Serialize deploys. Two merges in quick succession must not race to update the
# same revision, and cancel-in-progress would be wrong here: a half-finished
# deploy that has run migrations but not yet rolled the app is worse than a slow
# queue.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for federated (OIDC) login to Azure

env:
  AZURE_RESOURCE_GROUP: agentic-housing-rg
  REGISTRY: agentichousingacr
  IMAGE_REPO: agentic-housing-drafting
  CONTAINER_APP: agentic-housing-app
  BOOTSTRAP_JOB: agentic-housing-bootstrap
  STATIC_APP: agentic-housing-web

  # Two hostnames, because the app and the API are hosted separately: the app
  # from a static host that is always warm, the API from a container that scales
  # to zero. Repository *variables* rather than literals so that moving a
  # hostname -- binding the custom domains, for instance -- is a settings change
  # and not a commit. Defaults are the pre-custom-domain hostnames.
  #
  #   gh variable set APP_URL --body https://cle-draft.lemmalegal.com
  #   gh variable set API_URL --body https://api.cle-draft.lemmalegal.com
  APP_URL: ${{ vars.APP_URL || 'https://jolly-grass-096c65c10.7.azurestaticapps.net' }}
  API_URL: ${{ vars.API_URL || 'https://cle-draft.lemmalegal.com' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # No submodules. private-content is a private repo, and production reads
      # organization content from the published storage share rather than from
      # the image — so CI needs no deploy key. The suite passes without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          pip install -r requirements.txt

      - name: Django system checks
        run: python backend/manage.py check
        env:
          DJANGO_DEBUG: 'true'

      # Every app, by discovery. A hand-kept list here once left six apps --
      # the argument gym and validation among them, 263 tests -- out of CI.
      # Discovery has to start in backend/: from the repository root it finds
      # no tests at all and still exits 0.
      - name: Backend tests
        working-directory: backend
        run: python manage.py test
        env:
          DJANGO_DEBUG: 'true'

      # Matches the Dockerfile's node:24-slim frontend stage. CI must build on
      # the runtime production builds on, or a build that passes here can still
      # fail in the image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm run test
        working-directory: frontend

      # Chromium only. The smoke check is about whether each screen renders at
      # all, which does not differ between engines, and installing three would
      # cost more than the check itself.
      - name: Install Chromium for the screen smoke check
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Opens every screen in the built app against a stubbed API. A component
      # that is used but never defined compiles and deploys perfectly well and
      # then throws on render, so nothing above this line catches it: only
      # rendering the screen does.
      - name: Screen smoke check
        run: npm run test:smoke
        working-directory: frontend

      - name: Upload the smoke report when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-smoke-report
          path: |
            frontend/playwright-report-smoke/
            frontend/test-results-smoke/
          retention-days: 7

  deploy:
    needs: test
    # Never on a pull request: the test job above gates the merge, and this job
    # publishes to production.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # To require manual approval before production, create a "production"
    # environment in repo settings with required reviewers and uncomment the
    # line below. The federated credential for it already exists.
    # environment: production
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        id: build
        run: |
          set -Eeuo pipefail
          TAG="${GITHUB_SHA::12}"
          IMAGE="${REGISTRY}.azurecr.io/${IMAGE_REPO}:${TAG}"
          # Built in ACR rather than on the runner: the build context stays in
          # Azure and no large layers are pushed back out over the network.
          az acr build --registry "$REGISTRY" \
            --image "${IMAGE_REPO}:${TAG}" \
            --image "${IMAGE_REPO}:latest" \
            --file Dockerfile . -o none
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Built $IMAGE"

      # Migrations and content ingestion run once, here, and must succeed before
      # the app is rolled. A failed migration therefore never reaches a revision
      # that serves traffic.
      - name: Run migrations and content ingestion
        run: |
          set -Eeuo pipefail
          IMAGE="${{ steps.build.outputs.image }}"

          az containerapp job update -g "$AZURE_RESOURCE_GROUP" -n "$BOOTSTRAP_JOB" \
            --image "$IMAGE" -o none

          EXECUTION="$(az containerapp job start -g "$AZURE_RESOURCE_GROUP" -n "$BOOTSTRAP_JOB" \
            --query name -o tsv)"
          echo "Job execution: $EXECUTION"

          for attempt in $(seq 1 120); do
            STATUS="$(az containerapp job execution show -g "$AZURE_RESOURCE_GROUP" \
              -n "$BOOTSTRAP_JOB" --job-execution-name "$EXECUTION" \
              --query properties.status -o tsv 2>/dev/null || echo Unknown)"
            case "$STATUS" in
              Succeeded)
                echo "Bootstrap succeeded."
                exit 0 ;;
              Failed|Degraded)
                echo "::error::Bootstrap job $STATUS. Logs follow."
                az containerapp job logs show -g "$AZURE_RESOURCE_GROUP" -n "$BOOTSTRAP_JOB" \
                  --container bootstrap --execution "$EXECUTION" --tail 200 || true
                exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo "::error::Bootstrap job did not finish within 20 minutes."
          exit 1

      # Only the image changes. The app's secrets, env vars, volume mounts,
      # scale rules, and bound custom domain all stay as they are — which is why
      # no production configuration needs to live in GitHub. Changing any of
      # those is a deliberate act: run scripts/deploy_azure_containerapps.sh.
      - name: Roll the container app to the new image
        run: |
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --image "${{ steps.build.outputs.image }}" -o none

      # The API goes first, deliberately. The app is the client; publishing it
      # ahead of the API it calls would put a build that expects new endpoints
      # in front of a deployment that does not have them yet.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the app against the deployed API
        run: npm ci && VITE_API_BASE="${API_URL}/api" npm run build
        working-directory: frontend

      - name: Publish the app to Static Web Apps
        run: |
          set -Eeuo pipefail
          # staticwebapp.config.json has to be inside the uploaded directory or
          # Static Web Apps never reads it, and every deep link 404s instead of
          # falling back to index.html.
          cp frontend/staticwebapp.config.json frontend/dist/
          # Read the deployment token through the OIDC login that is already
          # established, rather than storing a second long-lived secret whose
          # rotation nobody would remember.
          TOKEN="$(az staticwebapp secrets list -g "$AZURE_RESOURCE_GROUP" \
            -n "$STATIC_APP" --query properties.apiKey -o tsv)"
          npx --yes @azure/static-web-apps-cli@latest deploy frontend/dist \
            --deployment-token "$TOKEN" --env production

      - name: Verify the API is serving
        run: |
          set -Eeuo pipefail
          # The API scales to zero, so the first request also pays a cold start.
          for attempt in $(seq 1 45); do
            CODE="$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$API_URL/healthz" || echo 000)"
            if [ "$CODE" = "200" ]; then
              echo "Healthy: $API_URL"
              break
            fi
            [ "$attempt" -eq 45 ] && { echo "::error::$API_URL/healthz never returned 200 (last: $CODE)"; exit 1; }
            sleep 4
          done

          # Django rendering a login page proves the managed database is
          # reachable, which /healthz (answered by nginx) deliberately does not.
          LOGIN="$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$API_URL/admin/login/")"
          [ "$LOGIN" = "200" ] || { echo "::error::/admin/login/ returned $LOGIN"; exit 1; }
          echo "Database-backed page renders."

          # A redirect to http:// here means Django stopped honouring
          # X-Forwarded-Proto, which silently breaks secure cookies and CSRF.
          TARGET="$(curl -s -o /dev/null -m 30 -w '%{redirect_url}' "$API_URL/admin/")"
          case "$TARGET" in
            https://*) echo "HTTPS redirect intact: $TARGET" ;;
            *) echo "::error::/admin/ redirected to a non-HTTPS URL: $TARGET"; exit 1 ;;
          esac

      - name: Verify the app is serving and can reach the API
        run: |
          set -Eeuo pipefail
          # The static host is always warm; anything slow here is a real fault,
          # not a cold start, so this does not retry for a minute the way the
          # API check does.
          CODE="$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$APP_URL/")"
          [ "$CODE" = "200" ] || { echo "::error::$APP_URL/ returned $CODE"; exit 1; }

          # A deep link must fall back to index.html. If staticwebapp.config.json
          # failed to reach the upload, this 404s and every refresh on a subpage
          # breaks while the home page keeps working.
          DEEP="$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$APP_URL/draft/anything")"
          [ "$DEEP" = "200" ] || { echo "::error::SPA fallback is not configured ($DEEP)"; exit 1; }

          # The app and the API are separate origins now, so the API has to
          # allow this one by name. Without it every request from the app fails
          # in the browser while curl against the API keeps looking fine --
          # which is exactly how this breaks unnoticed.
          CORS="$(curl -s -i -m 30 -X OPTIONS "$API_URL/api/bootstrap/" \
            -H "Origin: $APP_URL" -H 'Access-Control-Request-Method: GET' \
            | tr -d '\r' | grep -i '^access-control-allow-origin:' || true)"
          case "$CORS" in
            *"$APP_URL"*) echo "CORS allows the app origin." ;;
            *) echo "::error::API does not allow Origin $APP_URL. Set DJANGO_CORS_ALLOWED_ORIGINS and run scripts/deploy_azure_containerapps.sh"; exit 1 ;;
          esac

          # Download filenames and LegalServer save status ride on response
          # headers a cross-origin caller cannot read unless they are exposed.
          # Omitting them fails silently: the header arrives, the browser hides
          # it, and the feature quietly does nothing.
          EXPOSED="$(curl -s -i -m 30 "$API_URL/readyz" -H "Origin: $APP_URL" \
            | tr -d '\r' | grep -i '^access-control-expose-headers:' || true)"
          case "$(echo "$EXPOSED" | tr 'A-Z' 'a-z')" in
            *content-disposition*x-legalserver-delivery*) echo "Response headers exposed." ;;
            *) echo "::error::API is not exposing Content-Disposition and X-LegalServer-* to $APP_URL"; exit 1 ;;
          esac

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.build.outputs.image }}\` |"
            echo "| Commit | ${GITHUB_SHA::12} |"
            echo "| App | $APP_URL |"
            echo "| API | $API_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
