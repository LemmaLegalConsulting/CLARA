# Coverage scope for the Ohio Administrative Code housing corpus.
#
# Maintained by hand. Everything else in this directory is generated by
# scripts/ingest_ohio_administrative_code.py; do not hand-edit it.
#
# The Revised Code says what the law is; for several housing statutes the
# agency rule says how it is applied, and a brief arguing the statute without
# the rule misses half the requirement. Each chapter here implements a chapter
# already in content/statutes/ohio-revised-code.

source:
  name: Ohio Administrative Code
  base_url: https://codes.ohio.gov/ohio-administrative-code
  publisher: Ohio Legislative Service Commission
  jurisdiction: Ohio
  content_kind: statute
  update_note: >-
    Rules are published on the effective date the adopting agency designates.
    Each record keeps that date and the authenticated PDF link.

targets:
  - ring: 1
    chapter: "4112-5"
    label: Ohio Civil Rights Commission -- discrimination, including housing (implements R.C. Chapter 4112)
    retrieval_hints: ["Ohio Civil Rights Commission", "fair housing", "reasonable accommodation", "housing discrimination"]
  - ring: 1
    chapter: "4781-12"
    label: Manufactured home parks (implements R.C. 4781.26 to 4781.52)
    retrieval_hints: ["manufactured home park", "mobile home park", "park operator", "lot rent"]
  - ring: 1
    chapter: "3701-32"
    label: Lead poisoning prevention, including lead hazard control orders (implements R.C. Chapter 3742)
    retrieval_hints: ["lead", "lead hazard", "lead-based paint", "lead poisoning", "lead hazard control order"]
  - ring: 2
    chapter: "109:4-3"
    label: Attorney General consumer sales practices rules (implements R.C. Chapter 1345)
    retrieval_hints: ["Consumer Sales Practices Act", "CSPA", "unfair or deceptive"]
