# Reviewable Auto-source routing policy.  Source IDs must match the retrieval UI.
# Defaults apply only when no more-specific rule matches.
sources:
  ohio-statutes:
    kind: rag
    label: Ohio Statutes and Administrative Code
    default: true
    default_reason: Primary-law baseline for general Ohio housing-law questions.
    when:
      - terms: [statute, code, revised code, section, orc, administrative code, adm.code, o.a.c.]
        reason: The question asks for statutory text or a code section.
  treatise:
    kind: rag
    label: Ohio eviction treatise
    default: true
    default_reason: Secondary-source baseline for issue spotting and practical context.
  ohio-ordinances:
    kind: rag
    label: Ohio local ordinances and court rules
    default: false
    default_reason: Local law that can change the outcome where the case is filed.
    when:
      - terms:
          - ordinance
          - municipal
          - city code
          - codified ordinances
          - local rule
          - housing court
          - pay to stay
          - pay-to-stay
          - rental registration
          - rental registry
          - certificate approving rental occupancy
          - lead safe
          - lead-safe
          - source of income
          - right to counsel
          - chronic nuisance
          - crime-free
          - akron
          - cincinnati
          - cleveland
          - cleveland heights
          - columbus
          - dayton
          - lakewood
          - toledo
        reason: The question concerns local law or a municipality this corpus covers.
  hud-handbook:
    kind: rag
    label: HUD Handbook
    default: false
    when:
      - terms:
          - hud
          - subsid
          - subsidy
          - subsidized
          - voucher
          - section 8
          - project-based
          - tenant rent
          - recertification
          - interim recertification
          - termination of assistance
          - assisted housing
          - "4350.3"
        reason: The question concerns federally assisted housing or HUD Handbook 4350.3.
  green-book:
    kind: rag
    label: "HUD Housing Programs: Tenants’ Rights (Green Book)"
    when:
      - terms: [public housing, housing authority, pha, homeownership, qhwra, turnkey]
        reason: The question concerns public housing programs covered by the Green Book.
  federal-housing-law:
    kind: rag
    label: Federal housing law (U.S.C. and 24 C.F.R.)
    default: false
    when:
      - terms:
          - cares act
          - "9058"
          - covered dwelling
          - covered property
          - federally backed
          - vawa
          - violence against women
          - c.f.r.
          - cfr
          - u.s.c.
          - usc
          - public housing
          - housing authority
          - section 8
          - voucher
          - project-based
          - pbv
          - hud
          - subsid
          - assisted housing
          - lihtc
          - tax credit
          - 30-day notice
          - thirty-day notice
        reason: >-
          The question concerns a federal tenant protection or federally assisted
          housing; the statute or regulation decides who it covers.
  ohio-cases:
    kind: local_cases
    label: Ohio case law
    default: true
    default_reason: Local case-law corpus showing how Ohio courts have applied housing law.
    when:
      - terms: [case law, decision, precedent, appeal]
        reason: The question asks for judicial authority.
  case-file:
    kind: legalserver
    label: Selected case file
    when:
      - terms: [case, file, note, document, client]
        requires_matter: true
        reason: The question refers to the selected client's case materials.
  sharepoint:
    kind: sharepoint
    label: SharePoint
  user-resources:
    kind: user_resources
    label: User resources
    when:
      - terms: [brief, sample, uploaded, my resource]
        reason: The question explicitly refers to a private uploaded resource.
